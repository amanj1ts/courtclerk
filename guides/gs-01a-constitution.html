s=sec('Seen in the shifts');s.innerHTML+=`<div data-p="🔥">${tbl(['Concept','What was asked','Answer','Shifts','% correct','Trap'],SEEN)}</div><p class="text-xs">Note: Q (Art 154) and Art 168 items sit in other chapters and are omitted.</p>`;

const notes=[["🔥","Why FRs vs DPSP differ","FRs are justiciable, restrain the State and give political democracy; DPSPs are non-justiciable, direct the State and aim at social and economic democracy (Irish source). Minerva Mills: harmony between the two is part of basic structure. Today FRs prevail but Parliament may amend FRs for DPSP without touching basic structure."],["🔥","Why Art 32 and 226 differ","Art 32 is itself a fundamental right, so SC cannot refuse; it covers FR only. Art 226 is discretionary but wider: FR plus any other legal purpose."],["🔥","Why the Preamble matters","It is the summary and philosophy of the Constitution; non-enforceable; cannot override Articles; amendable within basic structure."],["⭐","Why India is quasi-federal","Two governments and written constitution, but Parliament can alter states (Art 3), emergency converts to unitary, single citizenship, and Governor is Centre’s agent."],["⭐","Art 14 two ideas","‘Equality before law’ (British, negative) and ‘equal protection’ (US, positive); reasonable classification allowed, class legislation not."],["⭐","Art 25 vs 26","Individual right to profess, practise, propagate versus collective right of denominations to manage religious affairs (needs common faith, organisation, distinct name)."]];
