sec('note','3. Concept notes',`<div class="space-y-2">
<div class="r" data-p="🔥"><b>🔥 Why repo moves matter.</b> Repo = rate RBI lends to banks against securities. Repo ↑ → bank funds costlier → loans costlier → demand ↓ → inflation ↓ (contractionary/hawkish). Repo ↓ = expansionary/dovish. Corridor: SDF (repo −25bp) floor, MSF (repo +25bp) ceiling. Bank rate is aligned with MSF. CRR = % of NDTL kept with RBI (cash); SLR = % of liabilities kept in govt securities, cash, gold. OMO: RBI buys bonds → money supply ↑; sells → ↓.</div>
<div class="r" data-p="🔥"><b>🔥 MPC.</b> Statutory, Sec 45ZB RBI Act, amended 2016; 6 members (3 RBI incl. Governor as chair, 3 govt nominees, 4-yr term); majority vote, Governor has casting vote; target CPI 4% ±2 (2021–26). Failure = outside 2–6% for 3 consecutive quarters → RBI reports to govt. Framework recommended by Urjit Patel Committee.</div>
<div class="r" data-p="🔥"><b>🔥 Payments.</b> NPCI = not-for-profit (Sec 8) umbrella body, initiative of RBI+IBA. Operates UPI/BHIM, IMPS, AePS, NETC (FASTag), NACH, BBPS, RuPay, NFS (ATM network). RTGS/NEFT are run by RBI: RTGS big-value, real-time, min ₹2 lakh; NEFT batch, from ₹1. IMPS 24×7 up to ₹5 lakh.</div>
<div class="r" data-p="🔥"><b>🔥 Development banks.</b> Give long-term finance: NABARD (agri/rural refinance), SIDBI (small industry), EXIM (foreign trade), NHB (housing), NaBFID (infrastructure), MUDRA (microfinance). IDBI/IFCI = industrial finance.</div>
<div class="r" data-p="🔥"><b>🔥 Planning logic.</b> Plans were Soviet-style; mixed economy after 1948 IPR. Order of focus: agri → heavy industry → agri/self-reliance → (holiday) → stability/poverty → Garibi Hatao → rolling → poverty/tech → employment → liberalisation → equity → poverty/regional → inclusive → faster/sustainable. NITI Aayog replaced the Planning Commission (2015).</div>
<div class="r" data-p="🔥"><b>🔥 1991 crisis → NEP.</b> Forex only ~2 weeks of imports; $7bn IMF/WB loan with liberalisation. Stabilisation = short term (BoP, inflation); structural = efficiency. LPG: licensing abolished except aerospace/defence electronics, hazardous chemicals, explosives, alcohol, tobacco, drugs; public sector reserved only atomic energy & railways; disinvestment; rupee devalued; FERA→FEMA.</div>
<div class="r" data-p="🔥"><b>🔥 Green Revolution.</b> 1960s, IADP + HYVP; HYV seeds, fertiliser, irrigation, mechanisation; wheat & rice; negatives: soil/water damage, bigger farmers gained → inequality. M.S. Swaminathan as ‘father’ and Punjab/Haryana/W-UP as core area are not in the supplied source [VERIFY].</div>
<div class="r" data-p="⭐"><b>⭐ BoP & trade bodies.</b> Current account: goods, services, income, transfers (remittances are transfers). Capital account: FDI (>10% / control), FPI (≤10%, hot money), ECB, NRI deposits. Loans = capital; interest, gifts = current. IMF = BoP support (SDR 1969); IBRD/IDA = development; WTO (1995) successor to GATT (1947).</div></div>`);
