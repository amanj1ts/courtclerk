['f','H','The coast between Goa and Mangalore is the',['Konkan','Malabar','Kannada','Coromandel'],2,'Kannada/Karnataka coast. Konkan = Daman–Goa; Malabar = Kerala.'],
['f','M','Which hill range is NOT part of Purvanchal?',['Naga','Mizo','Patkai Bum','Zaskar'],3,'Zaskar is Trans-Himalaya (Ladakh). Others are eastern hills.'],
['f','M','Which statement is correct?',['Eastern Ghats are higher and more continuous','Western Ghats are higher and more continuous','Eastern Ghats rise to Anamudi','Western Ghats are cut by the Mahanadi'],1,'Western Ghats avg 1,500 m, continuous. Eastern are low, broken by rivers.'],
['f','H','The highest peak of the Eastern Ghats is',['Mahendragiri','Doddabetta','Anamudi','Nokrek'],0,'Mahendragiri (Odisha). Nokrek is Garo hills.'],
['s','E','Alaknanda and Bhagirathi meet at',['Rudraprayag','Devprayag','Karnaprayag','Vishnuprayag'],1,'Devprayag, after which it is Ganga. Rudraprayag = Mandakini meets Alaknanda.'],

];
const L={E:'Easy',M:'Moderate',H:'Hard'};
const qh=Q.map((q,i)=>`<div class="card" data-p="${q[0]}"><b>${B[q[0]]} Q${i+1} · ${L[q[1]]}.</b> ${q[2]}<div class="mt-1 space-y-0.5">${q[3].map((o,j)=>`<div>(${'ABCD'[j]}) ${o}</div>`).join('')}</div><button class="noprint mt-2 px-2 py-1 bg-indigo-600 text-white rounded" onclick="this.nextElementSibling.classList.toggle('on')">Show answer</button><div class="ans mt-1 p-2 bg-emerald-100 dark:bg-emerald-900 rounded"><b>Ans: ${'ABCD'[q[4]]}.</b> ${q[5]}</div></div>`).join('');

const card=ul(['Himalaya N→S: Himadri, Himachal, Shiwalik','Karakoram = northernmost, glaciated; Indira Col 37°6′N','Purvanchal: Patkai, Naga, Manipur, Mizo; Mishmi','Khasi Hills = Cherrapunji/Mawsynram','Bhabar (vanish) → Terai (re-emerge); Bhangar older; Khadar new','Peninsula = oldest, crystalline; from Gondwanaland','Limits: Delhi Ridge NW, Gir W, Rajmahal E, Cardamom S','Anamudi 2,695 m highest peninsular; Doddabetta = Nilgiri; Mahendragiri = Eastern Ghats','Luni: ephemeral, Rann of Kachchh','Konkan Daman–Goa; Kannada Goa–Mangalore; Malabar Kerala','Barren Island active, Andaman; 10° channel A|N; Indira Point south','Lakshadweep = coral; A&N = submarine mountains','Indus: Bokhar Chu; Jhelum Verinag; Ravi between Pir Panjal and Dhauladhar; Beas→Sutlej at Harike','Ganga: Devprayag; left Gandak, Kosi, Ghaghara; right Son, Damodar','Brahmaputra: Chemayungdung, Dihang, Dhubri','Narmada Amarkantak, Satpura–Vindhya rift; Tapi Betul','Godavari Trimbak; Krishna Mahabaleshwar; Kaveri Brahmagiri','Wular largest fresh; Chilika largest brackish; Vembanad longest','East rivers: deltas; west: estuaries (Narmada, Tapi)']);

const verify=ul(['Guru Shikhar (Aravalli high point, Mt Abu) and Sambhar Lake: not in attached books.','Kamrunag Lake (Himachal), Chetlat (Lakshadweep), Devdi (Gujarat), Niyamgiri (Odisha), Burhner/Banjar/Sher (Narmada), Nevasa (Godavari tributary): asked in shifts but missing from sources.','Waterfall heights and Ramsar site lists: not in sources.','Shift keys unextracted: Luni end (Q91), A&N vs Lakshadweep (Q14), peninsular south rocks (Q33, answer metamorphic is likely), Himalayas E–W in Darjeeling/Sikkim (Q43 as keyed).','Dam/river details follow the UDAAN tables as printed.']);

const A=document.getElementById('app');
let h=`<p class="mb-1">Legend: 🔥 tested or must-cover · ⭐ likely neighbour · ◻ possible. Use the top filter.</p>`;
h+=sec('s1','1. Snapshot',`<div class="card">${ul(['Weight: about 5 geography questions per shift across GS-05a and 05b; priority 🔥.','Past shifts asked: pairings (division→feature), plain zones, river origin/location, coasts, islands, lakes.','Hard questions (under 30% correct) were obscure places: Chetlat, Kamrunag, Devdi.','Approach: (1) learn six divisions, (2) Himalaya ranges and plain zones, (3) Ghats and peaks, (4) coast/channel order, (5) river origin + tributary side, (6) lakes superlatives.','Skip rare places only after the core is solid; 1/4 negative marking means eliminate before guessing.'])}</div>`);
h+=sec('s2','2. Seen in the shifts',tbl(['Concept','What was asked','Answer','Shifts / % correct','Trap'],seen));
h+=sec('s3','3. Concept notes',`<div class="card">${notes}</div>`);
h+=sec('s4','4. Fact tables',Object.entries(facts).map(([t,[hd,rows]])=>`<h3 class="font-semibold mt-3">${t}</h3>${tbl(hd,rows)}`).join('')+`<details class="card"><summary class="font-semibold cursor-pointer">Skip unless time is left</summary>${ul(['Drainage types: consequent, subsequent, obsequent, resequent, antecedent, superimposed.','Patterns: dendritic, trellis, radial, centripetal, barbed, annular.','Glacier details (Biafo, Hispar, Zemu, Milam); Kosi barbed tributaries; Falkenmark index.'])}</details>`);
h+=sec('s5','5. Memory aids',`<div class="card">${aids}</div>`);
h+=sec('s6','6. Trap alerts',`<div class="card">${traps}</div>`);
h+=sec('s7','7. Practice set (26 MCQs)',qh);
h+=sec('s8','8. 60-second revision card',`<div class="card">${card}</div>`);
h+=sec('s9','9. Verify before exam',`<div class="card border-amber-500">${verify}</div>`);
A.innerHTML=h;
</script></body></html>
